<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Krystal Beaded Bliss — Hand-strung bead jewellery, made in Lagos</title>
    <meta name="description" content="Bracelets, necklaces, earrings and sets, strung one at a time in Lagos. Shop the collection or design a piece of your own." />
    <meta name="theme-color" content="#16120E" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Krystal Beaded Bliss" />
    <meta property="og:title" content="Krystal Beaded Bliss — Hand-strung bead jewellery, made in Lagos" />
    <meta property="og:description" content="Bracelets, necklaces, earrings and sets, strung one at a time in Lagos." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Resolve the theme before first paint, or the page flashes the wrong
      // one and looks broken.
      //
      // Dark is the default: beads and metal read better against a dark
      // ground than a light one. Light stays one tap away in the header.
      (function () {
        try {
          if (localStorage.getItem('kbb-theme') !== 'light') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui; padding: 2rem; text-align: center">
        Krystal Beaded Bliss needs JavaScript to run. Please enable it, or message
        us on WhatsApp and we will take your order by hand.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
